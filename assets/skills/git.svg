<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="164" height="63" viewBox="0 0 164 63"
     role="img" aria-label="Git">
  <defs>
    <filter id="glow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <image href="data:image/png;base64,"
         x="0" y="0" width="164" height="63" />

  <rect x="5.8" y="5.8" width="152.4" height="51.4"
        rx="4" ry="4" fill="none" stroke="#ffffff" stroke-width="1.15"
        opacity=".10">
    <animate attributeName="opacity"
             values=".08;.28;.08"
             dur="3.6s"
             repeatCount="indefinite"/>
  </rect>

  <rect x="6.2" y="6.2" width="151.6" height="50.6"
        rx="4" ry="4" fill="none" stroke="#ffffff" stroke-width="1.5"
        stroke-linecap="round" pathLength="100"
        stroke-dasharray="13 87" filter="url(#glow)" opacity=".78">
    <animate attributeName="stroke-dashoffset"
             from="0" to="-100"
             dur="2.8s"
             repeatCount="indefinite"/>
    <animate attributeName="opacity"
             values=".35;.9;.35"
             dur="2.8s"
             repeatCount="indefinite"/>
  </rect>
</svg>
